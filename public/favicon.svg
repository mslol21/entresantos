<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gold-seal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF2B2" />
      <stop offset="45%" stopColor="#CF9E1C" />
      <stop offset="100%" stopColor="#8C680E" />
    </linearGradient>
    <radialGradient id="seal-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="85%" stopColor="#F7F4EB" />
      <stop offset="100%" stopColor="#EDE6D6" />
    </radialGradient>
  </defs>

  {/* Background Medallion */}
  <circle cx="60" cy="60" r="56" fill="url(#seal-bg)" stroke="url(#gold-seal)" stroke-width="3" />
  <circle cx="60" cy="60" r="50" fill="none" stroke="#CF9E1C" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />

  {/* Center Cross / Monogram Seal */}
  <g transform="translate(60, 60)">
    {/* Holy Cross */}
    <path d="M0 -30 V26 M-14 -12 H14" stroke="url(#gold-seal)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="0" cy="-12" r="2.2" fill="#FFFFFF" stroke="#CF9E1C" stroke-width="0.8" />
    
    {/* Subtle Lettering / Stylized Monogram */}
    <text x="0" y="38" font-family="'Cinzel', 'Playfair Display', serif" font-size="11" font-weight="700" fill="#0B284C" text-anchor="middle" letter-spacing="2">ENTRE SANTOS</text>
  </g>
</svg>